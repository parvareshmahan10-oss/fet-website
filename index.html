<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FET — Functional Ensemble of Temperament</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

:root {
  --bg: #f4efe6;
  --surface: #ffffff;
  --border: rgba(80,60,30,0.12);
  --border-strong: rgba(80,60,30,0.22);
  --text: #1c1a14;
  --text2: #3a3528;
  --muted: #7a7060;
  --ne: #1a6abf;
  --da: #c45a18;
  --ach: #1a8c54;
  --accent: #9a7a3a;
  --accent-light: rgba(154,122,58,0.10);
  --shadow-sm: 0 2px 12px rgba(80,60,20,0.08);
  --shadow-md: 0 8px 32px rgba(80,60,20,0.12);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(154,122,58,0.06) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 85%, rgba(26,106,191,0.04) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 50%, rgba(26,140,84,0.03) 0%, transparent 60%);
}

/* ── PAGE WRAPPER: full viewport, no scroll needed ── */
.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4vh 4rem 4vh;
  gap: 3.5vh;
}

/* TITLE */
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(5.5rem, 14vw, 13rem);
  font-weight: 300;
  letter-spacing: 0.18em;
  line-height: 1;
  animation: fadeUp 0.8s ease 0.2s both;
}

.letter-f { color: var(--ne); }
.letter-e { color: var(--accent); }
.letter-t { color: var(--da); }

/* SUBTITLE */
.hero-sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1rem, 2vw, 1.3rem);
  font-weight: 300;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--muted);
  animation: fadeUp 0.8s ease 0.35s both;
  text-align: center;
}

/* DESCRIPTION */
.hero-desc {
  max-width: 560px;
  font-size: clamp(0.95rem, 1.4vw, 1.1rem);
  line-height: 1.9;
  color: var(--text2);
  text-align: center;
  animation: fadeUp 0.8s ease 0.5s both;
}

/* ── 3D CARDS GRID ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.8rem;
  width: 100%;
  max-width: 680px;
  perspective: 1200px;
  animation: fadeUp 0.8s ease 0.65s both;
}

.test-card {
  position: relative;
  text-decoration: none;
  color: inherit;
  display: block;
  border-radius: 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(80,60,20,0.08);
  transition: transform 0.35s cubic-bezier(0.23,1,0.32,1),
              box-shadow 0.35s cubic-bezier(0.23,1,0.32,1);
  transform-style: preserve-3d;
  cursor: pointer;
}

.test-card:hover {
  box-shadow:
    0 32px 64px rgba(80,60,20,0.18),
    0 0 0 1px var(--border-strong),
    inset 0 1px 0 rgba(255,255,255,0.9);
}

/* no top bar anymore */
.card-accent-bar { display: none; }

.card-inner {
  padding: 2.8rem 2.4rem 2.4rem;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  min-height: 220px;
  position: relative;
}

/* large faded letter background */
.card-bg-letter {
  position: absolute;
  bottom: -1.5rem;
  right: -0.5rem;
  font-family: 'Cormorant Garamond', serif;
  font-size: 10rem;
  font-weight: 300;
  line-height: 1;
  color: var(--accent);
  opacity: 0.055;
  pointer-events: none;
  letter-spacing: -0.02em;
  transition: opacity 0.35s, transform 0.35s;
  user-select: none;
}

.test-card:hover .card-bg-letter {
  opacity: 0.10;
  transform: scale(1.05) translateY(-4px);
}

/* top row: small label + arrow */
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-bottom: 2rem;
}

.card-label {
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
}

.card-arrow-circle {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  font-size: 1rem;
  transition: all 0.3s;
  background: var(--accent-light);
  flex-shrink: 0;
}

.test-card:hover .card-arrow-circle {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  transform: rotate(45deg);
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.6rem, 4vw, 3.4rem);
  font-weight: 300;
  line-height: 1.05;
  color: var(--text);
  letter-spacing: 0.01em;
  margin-top: auto;
}

.card-title em { font-style: italic; color: var(--accent); }

/* bottom line on hover */
.card-inner::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(to right, var(--accent), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
}
.test-card:hover .card-inner::after { transform: scaleX(1); }

/* shine overlay on hover */
.card-shine {
  position: absolute; inset: 0; border-radius: 28px;
  pointer-events: none; opacity: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 55%);
  transition: opacity 0.35s;
}
.test-card:hover .card-shine { opacity: 1; }

/* ANIMATIONS */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .page { padding: 5vh 2rem 5vh; gap: 3vh; }
  .cards-grid { grid-template-columns: 1fr; max-width: 420px; }
}

@media (max-width: 550px) {
  .hero-desc { font-size: 0.95rem; }
  .card-inner { padding: 1.5rem 1.5rem 1.8rem; }
}
</style>
</head>
<body>

<div class="page">

  <h1 class="hero-title">
    <span class="letter-f">F</span><span class="letter-e">E</span><span class="letter-t">T</span>
  </h1>

  <p class="hero-sub">Functional Ensemble of Temperament</p>

  <p class="hero-desc">
    A neurochemically grounded model of personality — developed at McMaster University
    in collaboration with Cambridge University.
  </p>

  <div class="cards-grid">

    <!-- TEST -->
    <a href="test.html" class="test-card">
      <div class="card-shine"></div>
      <div class="card-accent-bar bar-stq"></div>
      <div class="card-inner">
        <div class="card-bg-letter">T</div>
        <div class="card-top">
          <span class="card-label">Assessment</span>
          <div class="card-arrow-circle">↗</div>
        </div>
        <h3 class="card-title"><em>Test</em></h3>
      </div>
    </a>

    <!-- References -->
    <a href="https://psonline.ca/ira/ira.html" target="_blank" class="test-card">
      <div class="card-shine"></div>
      <div class="card-accent-bar bar-ref"></div>
      <div class="card-inner">
        <div class="card-bg-letter">R</div>
        <div class="card-top">
          <span class="card-label">Academic</span>
          <div class="card-arrow-circle">↗</div>
        </div>
        <h3 class="card-title">References &amp; <em>Publications</em></h3>
      </div>
    </a>

  </div>

</div>

<script>
// 3D tilt on mouse move
document.querySelectorAll('.test-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const rx = (((e.clientY - rect.top)  / rect.height) - 0.5) * -10;
    const ry = (((e.clientX - rect.left) / rect.width)  - 0.5) *  10;
    card.style.transform = `translateY(-8px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.02)`;
  });
  card.addEventListener('mouseenter', () => {
    card.style.transition = 'transform 0.08s, box-shadow 0.2s';
  });
  card.addEventListener('mouseleave', () => {
    card.style.transition = 'transform 0.55s cubic-bezier(0.23,1,0.32,1), box-shadow 0.35s';
    card.style.transform = '';
  });
});
</script>
</body>
</html>
