<script>

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEautFo6-EmOwnzfuRnlEoj-MYT7DjdkvIVZdC2a25NVnqeXD03yrneKeSqGkOXq_7Fg/exec";

function buildSubmissionPayload(){
  return {
    form: "STQ-77",
    language: lang,
    demographics: demo,
    answers: answers,
    submittedAt: new Date().toISOString()
  };
}

function submitToGoogleSheets(){
  const payload = buildSubmissionPayload();

  // Form-encoded POST is the most reliable simple request for Google Apps Script from GitHub Pages.
  const body = new URLSearchParams();
  body.append("payload", JSON.stringify(payload));

  try {
    if (navigator.sendBeacon) {
      const beaconBody = new Blob([body.toString()], { type: "application/x-www-form-urlencoded;charset=UTF-8" });
      const sent = navigator.sendBeacon(GOOGLE_SCRIPT_URL, beaconBody);
      if (sent) {
        console.log("STQ-77 sent to Google Sheets with sendBeacon");
        return;
      }
    }
  } catch (err) {
    console.warn("sendBeacon failed, using fetch fallback", err);
  }

  try {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: body.toString(),
      keepalive: true
    });
    console.log("STQ-77 sent to Google Sheets with fetch fallback");
  } catch (error) {
    console.error("Google Sheets submission failed:", error);
  }
}

const QUESTIONS = { en: ["I get pleasure from doing physical work in my free time.", "Even after investing a lot of effort, I can still drop a plan and switch to a new one fairly easily.", "I like to participate in games requiring quick physical moves.", "In large social gatherings, it is easy for me to chat with many people and not get tired.", "I am bored when people around talk about politics or science.", "I can easily handle rapid conversations.", "When I am waiting for someone who is slow, I will give them a push, at least verbally.", "I remain optimistic even in challenging situations.", "I don't like risky activities.", "I can switch between multiple tasks as quickly as needed.", "I am often preoccupied with regrets and dissatisfaction by the outcomes of my actions.", "Learning from books and experts takes time, but it gives me pleasure.", "I am never late for an appointment or work.", "I enjoy physically demanding activities or games.", "There's no point overthinking why things happen or how something works.", "I do my physical work quite quickly.", "I can handle long explanations and discussions with almost anybody.", "I am almost never angry even when things don't work out.", "I like to speak quickly.", "I devote my life to the interests, problems and wishes of other people.", "I like to use services from places that I know rather than ones that I have never used before, even if the other places might be better.", "Even as an adult, I've done several rather risky things just for the thrill of it.", "Since childhood, I’ve managed multiple interests, with not much time left for relaxation.", "It's easy for me to talk about myself with strangers.", "When I have to do mental work (reading, planning, calculations), I get tired rather quickly.", "I sometimes talk about things I do not understand.", "I can finish a prolonged manual job without taking a break.", "I am often criticized for being \"too relaxed\" about life stresses.", "My hand movements are quick and agile.", "In my spare time, I like talking to people rather than doing something on my own.", "I quickly move into high gear in doing physical work.", "I speak fluently without hesitation.", "I often react too fast by doing or saying something that I might regret later.", "It is always wise just to expect the worst rather than be unprepared when it comes.", "I often find it annoying when people hold my attention by talking about their failures.", "I like intellectual games, requiring concentration and thinking.", "I often hesitate when I'm unexpectedly asked to do something I wasn't told about in advance.", "For prolonged work, I rather prefer intellectual than physical activities.", "I sometimes gossip.", "In doing physical work, it takes a while before I get tired.", "A long preparation or planning of important events and exams tires me.", "I prefer to do my physical work at a fast pace.", "My conversations with staff at work or with neighbours are usually very brief, so people don't see me as a \"social\" person.", "Call me a wet blanket, but I usually look for scientific rather than mystical explanations of anything unusual.", "It's hard for me to talk fast.", "When things take too long, I always either try to speed them up or drop them.", "Places that I didn't plan to be in or unexpected turns of events make me more tense (worry) than curious.", "Taking a risk is the main way for me to control boredom.", "I readily begin detailed planning and initiation of even complex projects.", "I am always curious about the thoughts and motivations of even the worst people.", "It is easy for me to do work requiring prolonged thinking and attention.", "I don't have time for other people's problems.", "Manual labour tires me very quickly.", "I love experimenting with something stimulating and new that make me feel unusual.", "I can do housework at a fast pace and still do a decent job.", "I'm silent even among my friends.", "When I make mistakes, I take it much easier than let lang='en', current=0, answers=Array(77).fill(null), demo={};
const PARTICIPANT_KEY = 'fet_participant';
const DEV_MODE = true; // ← set false before going live
function getParticipant(){ try{ const r=localStorage.getItem(PARTICIPANT_KEY); return r?JSON.parse(r):null; }catch(e){return null;} }
function loadParticipantIntoDemo(){ const p=getParticipant(); if(p&&p.data){ demo=Object.assign({},p.data,{gender:p.radioState?.gender,hand:p.radioState?.hand}); } }

/* ── SAVE / RESTORE ── */
const STQ_KEY = 'stq77_progress';
function saveProgress(){
  localStorage.setItem(STQ_KEY, JSON.stringify({ lang, current, answers, demo,
    phase: $('qContainer').classList.contains('active') ? 'q' : 'demo' }));
}
function clearProgress(){ localStorage.removeItem(STQ_KEY); }
function checkSaved(){
  // If participant info exists — skip lang modal entirely
  const p = getParticipant();
  if(p && p.data && p.data.fname){
    const pl = p.lang || 'en';
    const savedSTQ = localStorage.getItem(STQ_KEY);
    if(savedSTQ){
      try{
        const s = JSON.parse(savedSTQ);
        if(s.lang && s.answers){ restoreProgress(); return; }
      }catch(e){}
    }
    startForm(pl); return;
  }
  // No participant info — show lang modal with optional "continue" block
  try {
    const raw = localStorage.getItem(STQ_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(!s.lang || !s.answers) return;
    const modal = document.querySelector('.lang-modal');
    const cont = document.createElement('div');
    cont.id = 'continueBlock';
    cont.innerHTML = `<div style="margin-bottom:1.4rem;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:16px;background:var(--surface2)">
      <div style="font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem">Saved session</div>
      <div style="font-size:.95rem;color:var(--ink);margin-bottom:.9rem">Question ${s.current+1} / 77 &mdash; ${s.lang.toUpperCase()}</div>
      <button class="lang-btn" style="width:100%;font-weight:500" onclick="restoreProgress()">Continue where you left off →</button>
    </div>
    <div style="font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem">— or start fresh —</div>`;
    modal.insertBefore(cont, modal.querySelector('.lang-options'));
  } catch(e){}
}
function restoreProgress(){
  try {
    const s = JSON.parse(localStorage.getItem(STQ_KEY));
    lang=s.lang; current=s.current; answers=s.answers; demo=s.demo||{};
    loadParticipantIntoDemo(); // override with latest participant info if available
    const u=UI[lang];
    document.documentElement.lang=lang; document.documentElement.dir=u.dir;
    $('langOverlay').style.display='none';
    if(s.phase==='q'){
      $('qContainer').classList.add('active');
      renderQuestion();
    } else {
      if(getParticipant()&&getParticipant().data){
        $('qContainer').classList.add('active'); renderQuestion();
      } else {
        $('demoContainer').classList.add('active');
        $('demoBadge').textContent=u.badge; $('demoTitle').innerHTML=u.title;
        $('demoSec1').textContent=u.sec; $('beginBtn').textContent=u.begin;
        $('demoNotice').textContent=u.notice;
        renderDemo();
      }
    }
    updateProgress();
  } catch(e){}
}
function $(id){return document.getElementById(id)}
function startForm(l){
  lang=l; const u=UI[l];
  document.documentElement.lang=l; document.documentElement.dir=u.dir;
  $('langOverlay').style.display='none';
  loadParticipantIntoDemo();
  if(DEV_MODE || (getParticipant()&&getParticipant().data&&getParticipant().data.fname)){
    // DEV_MODE or participant info on file — go straight to questions
    $('qContainer').classList.add('active'); renderQuestion(); updateProgress(); saveProgress();
  } else {
    // No participant info — show demo form first
    $('demoContainer').classList.add('active');
    $('demoBadge').textContent=u.badge; $('demoTitle').innerHTML=u.title;
    $('demoSec1').textContent=u.sec; $('beginBtn').textContent=u.begin;
    $('demoNotice').textContent=u.notice;
    renderDemo();
  }
}
function renderDemo(){const grid=$('demoGrid'); grid.innerHTML=''; UI[lang].fields.forEach(([id,label,type])=>{ const wrap=document.createElement('div'); wrap.className='demo-field'; const lab=document.createElement('label'); lab.className='demo-label'; lab.textContent=label; wrap.appendChild(lab); if(type.startsWith('radio:')){ const group=document.createElement('div'); group.className='demo-radio-group'; type.slice(6).split('|').forEach(opt=>{ const b=document.createElement('div'); b.className='demo-radio'; b.textContent=opt; b.onclick=()=>{demo[id]=opt; group.querySelectorAll('.demo-radio').forEach(x=>x.classList.remove('selected')); b.classList.add('selected')}; group.appendChild(b); }); wrap.appendChild(group); } else { const inp=document.createElement('input'); inp.className='demo-input'; inp.type=type; inp.id='demo-'+id; inp.oninput=()=>demo[id]=inp.value; wrap.appendChild(inp); } grid.appendChild(wrap); });}
function startQuestions(){ UI[lang].fields.forEach(([id])=>{ const el=$('demo-'+id); if(el) demo[id]=el.value; }); $('demoContainer').classList.remove('active'); $('qContainer').classList.add('active'); renderQuestion();}
function renderQuestion(){
  const u=UI[lang];
  const q=QUESTIONS[lang][current] || QUESTIONS.en[current];
  $('qSectionLabel').textContent=`STQ-77 · ${current+1} / 77`;
  $('qText').textContent=q;
  $('ratingLabelLeft').textContent=u.left;
  $('ratingLabelRight').textContent=u.right;
  $('btnBack').textContent=u.back;
  $('btnNext').textContent=current===76?u.finish:u.next;
  $('skipNote').textContent=''; // no "press Enter" note
  $('btnBack').disabled=current===0;
  // Disable Next if no answer yet
  $('btnNext').disabled = !DEV_MODE && answers[current]===null;
  const rb=$('ratingButtons');
  rb.innerHTML='';
  const lbls=[u.left, u.lbl2||'', u.lbl3||'', u.right];
  for(let i=1;i<=4;i++){
    const b=document.createElement('button');
    b.className='r-btn'+(answers[current]===i?' selected':'');
    b.innerHTML=`<span style="font-size:1.4rem;font-weight:900">${i}</span><span style="font-size:.62rem;font-weight:600;letter-spacing:.05em;margin-top:.2rem;line-height:1.2;opacity:.85">${lbls[i-1]}</span>`;
    b.style.flexDirection='column';
    b.style.gap='.15rem';
    b.style.padding='.8rem .4rem';
    b.onclick=()=>{
      answers[current]=i;
      renderQuestion();
      saveProgress();
      setTimeout(()=>{ if(current<76) goNext(); }, 140);
    };
    rb.appendChild(b);
  }
  updateProgress();
}
function goBack(){ if(current>0){current--; renderQuestion(); saveProgress();} }
function goNext(){ if(!DEV_MODE && answers[current]===null) return; if(current<76){current++; renderQuestion(); saveProgress();} else showThanks(); }
let hasSubmittedToSheets=false;
function showThanks(){ const u=UI[lang]; if(!hasSubmittedToSheets){ hasSubmittedToSheets=true; submitToGoogleSheets(); } $('qContainer').classList.remove('active'); $('thankYou').classList.add('active'); $('tyTitle').innerHTML=u.ty; $('tyBody').textContent=u.body; $('downloadBtn').textContent=u.dl; updateProgress(true); }
function updateProgress(done=false){ let total=77, val=0; if($('qContainer').classList.contains('active')) val=(current+1)/total*100; if(done) val=100; $('progressFill').style.width=val+'%'; $('progressInfo').textContent = done ? 'Complete' : ($('qContainer').classList.contains('active') ? `${current+1} / ${total}` : 'STQ-77'); }
function csvEscape(v){ v=(v??'').toString(); return '"'+v.replaceAll('"','""')+'"'; }
function downloadCSV(){ const rows=[]; rows.push(['section','field','value']); Object.entries(demo).forEach(([k,v])=>rows.push(['demographics',k,v])); rows.push([]); rows.push(['item','question_en','question_'+lang,'response_1_to_4']); for(let i=0;i<77;i++) rows.push([i+1,QUESTIONS.en[i],QUESTIONS[lang][i]||QUESTIONS.en[i],answers[i]??'']); const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\n'); const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='STQ77_responses_'+lang+'.csv'; a.click(); URL.revokeObjectURL(url); clearProgress(); }
const SUN  = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
const MOON = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
const _html = document.documentElement;
const _btn  = document.getElementById('themeToggle');
const _icon = document.getElementById('toggleIcon');
const _saved = localStorage.getItem('fet-theme');
if (_saved) _applyTheme(_saved);
_btn.addEventListener('click', () => _applyTheme(_html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
function _applyTheme(t) { _html.setAttribute('data-theme', t); localStorage.setItem('fet-theme', t); _icon.innerHTML = t === 'dark' ? MOON : SUN; }
checkSaved();
document.addEventListener('keydown',e=>{ if(['1','2','3','4'].includes(e.key) && $('qContainer').classList.contains('active')){answers[current]=Number(e.key); renderQuestion(); saveProgress();} });
</script>
